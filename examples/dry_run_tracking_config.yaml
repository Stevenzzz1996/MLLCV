runtime:
  dry_run_gimbal: true
  show_gui: false
  record_enable: false
  console_status_sec: 1.0

video:
  source: "0"
  rtsp_transport: "tcp"
  buffer_size: 1
  reconnect_sec: 1.0
  rotate: 0

latency:
  max_frame_age_ms: 200
  drop_stale_frame: true

yolo26:
  enable: false
  backend: "ultralytics"
  model: "models/example-detector.pt"
  imgsz: 640
  conf: 0.35
  classes: null
  detect_interval_idle: 5
  detect_interval_track: 10
  detect_interval_lost: 5

tracking:
  backend: "asymtrack"

asymtrack:
  enable: false
  backend: "pytorch"
  model: "models/example-asymtrack.pth.tar"
  engine: "models/example-asymtrack.engine"
  repo_root: "third_party/AsymTrack"
  yaml_name: "tiny"
  device: "cpu"
  score_thr: 0.35
  max_lost_count: 10

ostrack:
  enable: false
  backend: "tensorrt"
  engine: "models/example-ostrack.engine"
  device: "cuda"
  template_factor: 2.0
  search_factor: 5.5
  template_size: 128
  search_size: 256
  score_threshold: 0.22
  template_update_score: 0.88
  template_update_interval: 24
  max_lost_count: 16

prediction:
  enable: true
  mode: "dkf"
  latency_est_ms: 200
  history_sec: 2.0
  predict_ms: 0
  max_predict_ms: 80
  process_noise: 5000.0
  measurement_noise: 25.0
  gate_px: 240
  gate_mahalanobis: 16.0
  yaw_px_per_cmd: 8.0
  pitch_px_per_cmd: 6.0

dkf:
  enabled: true
  latency_ms: 200
  pipeline_latency_ms: 20
  delayed_measurement_compensation: true
  max_measurement_delay: 0.45
  default_dt: 0.033
  max_dt: 0.36
  process_noise: 5000.0
  measurement_noise: 25.0
  gate_mahalanobis: 25.0

global_motion:
  enable: false

servo:
  mode: "p"
  kp_yaw: 20
  kp_pitch: 14
  deadzone_x: 0.010
  deadzone_y: 0.015
  smooth_alpha: 0.10
  max_yaw_speed: 12
  max_pitch_speed: 8
  min_yaw_speed: 1
  min_pitch_speed: 1
  yaw_sign: 1
  pitch_sign: 1

gimbal:
  ip: "192.168.144.25"
  port: 37260
  yaw_sign: 1
  pitch_sign: -1
  need_ack: false

control:
  command_file: "/tmp/source_track_command.json"
  operator_state_file: "/tmp/source_track_operator_action.json"
  command_hz: 30
  auto_max_yaw_speed: 12
  auto_max_pitch_speed: 8
  manual_speed_yaw: 10
  manual_speed_pitch: 8
  stop_on_stale_frame: true
  stop_on_tracker_lost: true
  lost_hold_ms: 600
  reacquire_search_ms: 1500

target_selector:
  preferred_class_ids: [0, 1, 3]
  require_preferred_class: false
  min_area_ratio: 0.001
  max_area_ratio: 0.5

confirm:
  confirm_frames: 2
  iou_thr: 0.12
  max_center_jump_ratio: 0.10
  require_same_class: true

display:
  fps_limit: 15
  show_yolo: true
  show_tracker: true
  show_prediction: true
  show_latency: true

preview:
  enable: false
  path: "/tmp/source_track_preview.jpg"
  fps: 10
  quality: 80

record:
  enable: false
  root: "recordings"
  save_video: false
  save_frames: false
  save_jsonl: true
  dataset: "dry_run"
