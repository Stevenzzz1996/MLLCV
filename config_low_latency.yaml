runtime:
  dry_run_gimbal: true
  show_gui: true
  record_enable: false
  console_status_sec: 1.0

video:
  source: "rtsp://192.168.144.25:8554/main.264"
  rtsp_transport: "udp"
  buffer_size: 1
  reconnect_sec: 1.0
  rotate: 0

latency:
  max_frame_age_ms: 150
  drop_stale_frame: true

yolo26:
  enable: true
  backend: "tensorrt"
  # VisDrone YOLOv8m 960, stronger aerial person/vehicle recall than the
  # previous yolov8s-p2 engine while keeping TensorRT latency acceptable.
  # Source: https://huggingface.co/mshamrai/yolov8m-visdrone
  # High-recall slower option: models/visdrone_hf/yolov8l/best.engine
  # Rectangular input keeps inference close to the native 1280x720 RTSP frame.
  model: "models/visdrone_hf/yolov8m/best_736x1280.engine"
  imgsz: [736, 1280]
  conf: 0.35
  # VisDrone classes are not COCO ids: 0 pedestrian, 1 people, 3 car.
  # Limit detector output to human/car targets for lower latency and fewer false locks.
  classes: [0, 1, 3]
  detect_interval_idle: 3
  detect_interval_track: 5
  detect_interval_lost: 3

tracking:
  backend: "ostrack"

ostrack:
  enable: true
  backend: "tensorrt"
  engine: "/home/mll/PycharmProjects/OSTrack/ostrack.engine"
  device: "cuda"
  template_factor: 2.0
  search_factor: 5.5
  template_size: 128
  search_size: 256
  score_threshold: 0.22
  template_update_score: 0.88
  template_update_interval: 24
  max_lost_count: 16
  min_size_scale: 0.45
  max_size_scale: 2.20
  max_size_growth_per_frame: 0.10
  max_size_shrink_per_frame: 0.18
  max_aspect_change: 1.80
  size_smooth_alpha: 0.70

asymtrack:
  enable: true
  # Use the FP32 TensorRT engine. The FP16 engine is faster but failed vehicle
  # sequence validation with NaNs/collapsed boxes.
  backend: "tensorrt"
  model: "/home/mll/Downloads/AsymTrack_ep0500.pth.tar"
  engine: "models/asymtrack/asymtrack_tiny_fp32.engine"
  repo_root: "third_party/AsymTrack"
  yaml_name: "tiny"
  device: "cuda"
  score_thr: 0.35
  max_lost_count: 10

prediction:
  enable: true
  mode: "dkf"
  latency_est_ms: 200
  history_sec: 2.0
  predict_ms: 0
  max_predict_ms: 80
  max_kf_age_ms: 260
  process_noise: 5000.0
  measurement_noise: 25.0
  init_pos_var: 100.0
  init_vel_var: 10000.0
  gate_px: 240
  gate_mahalanobis: 16.0
  reliable_sigma_px: 30
  max_sigma_px: 80
  yaw_px_per_cmd: 8.0
  pitch_px_per_cmd: 6.0

dkf:
  enabled: true
  latency_ms: 200
  pipeline_latency_ms: 20
  add_frame_age: true
  min_ahead_time: 0.01
  max_ahead_time: 0.04
  catchup_extra_ms: 0
  catchup_error: 0.14
  settle_error: 0.055
  catchup_vel_norm: 0.14
  catchup_gain: 0.0
  default_dt: 0.033
  max_dt: 0.36
  init_pos_var: 25.0
  init_size_var: 25.0
  init_vel_var: 400.0
  init_size_vel_var: 25.0
  process_noise: 5000.0
  measurement_noise: 25.0
  q_pos: 100.0
  q_size: 10.0
  q_vel: 7000.0
  q_size_vel: 50.0
  r_tracker_pos: 25.0
  r_tracker_size: 50.0
  r_detector_pos: 16.0
  r_detector_size: 36.0
  tracker_r_scale: 4.0
  detector_r_scale: 2.0
  tracker_velocity_blend: 0.25
  detector_velocity_blend: 0.18
  size_velocity_blend: 0.10
  velocity_deadband_px_s: 110
  stationary_speed_px_s: 150
  stationary_frames: 3
  stationary_velocity_decay: 0.04
  motion_enter_frames: 6
  max_velocity_px_s: 1600
  delayed_measurement_compensation: true
  max_measurement_delay: 0.45
  max_delayed_shift_px: 90
  camera_motion_compensation: true
  camera_motion_units: "px_s"
  camera_state_compensation: true
  camera_delay_compensation: false
  camera_future_compensation: false
  yaw_px_per_cmd: 8.0
  pitch_px_per_cmd: 6.0
  max_camera_shift_px: 90
  stationary_ahead_scale: 0.08
  min_motion_ahead_scale: 0.12
  gate_mahalanobis: 25.0
  max_predict_lost_count: 6
  lost_control_scale: 0.25
  max_uncertainty_px: 65

global_motion:
  enable: true
  downscale: 0.5
  max_corners: 600
  min_points: 80
  refresh_interval: 8
  max_velocity_px_s: 850
  smoothing_alpha: 0.45
  max_delta_px_s: 420
  reset_decay: 0.15

servo:
  mode: "p"
  kp_yaw: 28
  kp_pitch: 18
  kd_yaw: 0
  kd_pitch: 0
  deadzone_x: 0.006
  deadzone_y: 0.010
  hold_deadzone_x: 0.040
  hold_deadzone_y: 0.055
  stationary_vel_norm: 0.10
  min_speed_error_x: 0.008
  min_speed_error_y: 0.012
  smooth_alpha: 0.10
  max_yaw_speed: 22
  max_pitch_speed: 14
  min_yaw_speed: 1
  min_pitch_speed: 1
  max_ff_yaw_speed: 0
  max_ff_pitch_speed: 0
  max_gain_scale: 1.00
  center_lock_enter_x: 0.030
  center_lock_enter_y: 0.040
  center_lock_release_x: 0.080
  center_lock_release_y: 0.095
  overshoot_brake_error_x: 0.20
  overshoot_brake_error_y: 0.24
  yaw_sign: 1
  pitch_sign: 1

target_selector:
  # VisDrone: 0 pedestrian, 1 people, 3 car. Auto-detect only starts tracking
  # human/car targets; manual center/ROI can still initialize a generic target.
  preferred_class_ids: [0, 1, 3]
  require_preferred_class: true
  min_area_ratio: 0.0015
  max_area_ratio: 0.5
  score_conf_weight: 0.45
  score_pred_iou_weight: 0.35
  score_center_weight: 0.10
  score_area_weight: 0.10

confirm:
  confirm_frames: 2
  iou_thr: 0.12
  max_center_jump_ratio: 0.10
  require_same_class: true

gimbal:
  ip: "192.168.144.25"
  port: 37260
  yaw_sign: 1
  pitch_sign: -1
  need_ack: false

control:
  command_file: "/tmp/source_track_command.json"
  operator_state_file: "/tmp/source_track_operator_action.json"
  manual_center_box: "260x180"
  command_hz: 50
  auto_max_yaw_speed: 22
  auto_max_pitch_speed: 14
  max_yaw_delta_per_sec: 420
  max_pitch_delta_per_sec: 300
  manual_speed_yaw: 20
  manual_speed_pitch: 14
  stop_on_stale_frame: true
  stop_on_tracker_lost: true
  detector_correct_enable: false
  strict_detector_gate: false
  detector_correct_interval: 5
  detector_template_update_interval: 30
  detector_template_update_min_conf: 0.55
  detector_template_update_max_center_dist: 0.08
  detector_reinit_iou: 0.05
  detector_match_iou: 0.03
  detector_max_center_dist: 0.14
  detector_miss_limit: 20
  max_detector_age_ms: 1500
  max_center_error: 1.05
  reacquire_max_center_dist: 0.18
  lost_hold_ms: 600
  reacquire_search_ms: 1500
  min_target_conf: 0.35
  min_target_area_ratio: 0.0015
  min_target_box_width: 16
  min_target_box_height: 32
  human_class_ids: [0, 1]
  human_class_names: ["pedestrian", "people", "person"]
  human_min_conf: 0.35
  human_min_target_area_ratio: 0.00008
  human_min_target_box_width: 5
  human_min_target_box_height: 8

display:
  fps_limit: 15
  show_yolo: true
  show_tracker: true
  show_prediction: true
  show_latency: true

preview:
  enable: true
  path: "/tmp/source_track_preview.jpg"
  fps: 25
  quality: 70

record:
  enable: true
  auto_start: false
  dataset: "smolvla_scan"
  root: "recordings/smolvla_scan"
  save_video: true
  save_frames: true
  save_jsonl: true
  fps: 25
  queue_size: 120
